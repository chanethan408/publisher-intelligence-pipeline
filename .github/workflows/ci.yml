name: CI Pipeline Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black sqlfluff

      - name: Run Black code format check
        run: |
          black --check src tests dags

      - name: Run Flake8 Python linting
        run: |
          flake8 --config=.flake8 src tests dags --count --statistics

      - name: Run SQLFluff SQL linting
        run: |
          sqlfluff lint dbt_publisher_intel/models --dialect snowflake

dbt-validation:
    name: dbt Project Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt-core and Snowflake adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.7.9 dbt-snowflake==1.7.1

      - name: Create dummy dbt profile for compilation check
        run: |
          mkdir -p /home/runner/.dbt
          cat <<EOF > /home/runner/.dbt/profiles.yml
          publisher_intel:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: dummy_account
                user: dummy_user
                password: dummy_password
                role: dummy_role
                database: dummy_db
                warehouse: dummy_wh
                schema: dummy_schema
          EOF

      - name: Validate dbt syntax and compilation
        run: |
          cd dbt_publisher_intel
          dbt parse