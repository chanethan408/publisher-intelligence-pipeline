version: 2

models:
  - name: fct_daily_video_performance
    description: "Daily snapshot performance telemetry at (video_id, snapshot_date) grain."
    columns:
      - name: performance_pk
        description: "Deterministic surrogate key: MD5(video_id || snapshot_date)."
        tests:
          - unique
          - not_null

      - name: video_id
        description: "Foreign key referencing dim_videos."
        tests:
          - not_null
          - relationships:
              to: ref('dim_videos')
              field: video_id

      - name: channel_id
        description: "Foreign key referencing dim_channels."
        tests:
          - not_null
          - relationships:
              to: ref('dim_channels')
              field: channel_id

      - name: snapshot_date
        description: "Date of the snapshot pull."
        tests:
          - not_null